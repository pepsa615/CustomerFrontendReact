<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#9d0208" />
    <title>PEPSA — You’re offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fafafa;
        color: #211b1b;
        font:
          16px system-ui,
          sans-serif;
      }
      .card {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      .logo {
        width: 84px;
        border-radius: 22px;
      }
      h1 {
        color: #9d0208;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #9d0208;
        color: #fff;
        padding: 0.85rem 1.2rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/pepsa-wordmark.svg" alt="Pepsa" />
      <h1>You’re offline</h1>
      <p>Reconnect to continue securely with PEPSA.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
