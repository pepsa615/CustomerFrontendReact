server {
    listen 80;
    server_name customer.pepsa.co;
    root /home/pepsa/var/www/customer-frontend-production/dist;
    index index.html;
    include snippets/deny-sensitive.conf;
    server_tokens off;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
